name: Shadegram Windows

# Release build of the patched AyuGram (x64, Qt 6). Based on upstream tdesktop's win.yml.
# Libraries (Qt, ffmpeg, webrtc...) are built once and cached; the caches are saved right after they are
# built, even if the app build fails or the 6 h limit hits, so the next run continues from there.

on:
  push:
    branches: [ shadegram ]
    paths-ignore: [ 'docs/**', '**.md' ]
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\tdesktop

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/tdesktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/tdesktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "ci@shadegram"
          git config --global user.name "shadegram-ci"

      - uses: ilammy/msvc-dev-cmd@v1
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty.
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win64-third-party-${{ env.CACHE_KEY }}
          restore-keys: win64-third-party-

      - name: Restore Libraries.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: win64-libs-qt6-release-${{ env.CACHE_KEY }}
          restore-keys: win64-libs-qt6-release-

      - name: Libraries.
        run: |
          cd %TBUILD%
          call tdesktop\Telegram\build\prepare\win.bat silent qt6

      - name: Save ThirdParty.
        if: always() && steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win64-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save Libraries.
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LibrariesPath }}
          key: win64-libs-qt6-release-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Build.
        run: |
          cd %TBUILD%\tdesktop\Telegram
          call configure.bat x64 qt6 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ..\out --config Release --parallel

      - name: Collect.
        run: |
          mkdir artifact
          dir %TBUILD%\tdesktop\out\Release
          copy %TBUILD%\tdesktop\out\Release\*.exe artifact\

      - uses: actions/upload-artifact@v4
        with:
          name: shadegram-win64
          path: artifact\
          retention-days: 14
